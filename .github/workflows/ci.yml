name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The build only needs Supabase settings to exist; nothing here talks to a real project.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        # next-env.d.ts (image and route types) is generated, not committed.
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test -- --run
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
